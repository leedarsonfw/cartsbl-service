groups:
  - name: service-alerts
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target down ({{ $labels.job }} / {{ $labels.instance }})"
          description: "Prometheus target {{ $labels.job }} on {{ $labels.instance }} has been down for 2 minutes."

      - alert: RedisExporterDown
        expr: up{job="redis-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis exporter down ({{ $labels.instance }})"
          description: "redis-exporter has been down for 2 minutes on {{ $labels.instance }}."

      - alert: PostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Postgres exporter down ({{ $labels.instance }})"
          description: "postgres-exporter has been down for 2 minutes on {{ $labels.instance }}."

      - alert: MosquittoExporterDown
        expr: up{job="mosquitto-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Mosquitto exporter down ({{ $labels.instance }})"
          description: "mosquitto-exporter has been down for 2 minutes on {{ $labels.instance }}."

