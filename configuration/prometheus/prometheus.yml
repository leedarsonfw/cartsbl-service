global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    mac: PLACEHOLDER_MAC_ADDRESS

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# ChirpStack writes chirpstack-active.yml (UI/DB host + gateway rules plus merged service-alerts.yml).
rule_files:
  - /etc/prometheus/alerts-sync/chirpstack-active.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # BEGIN broker-job-mosquitto
  # Mosquitto metrics via exporter (subscribes to $SYS/broker/#). Single-node (ONE_NODE=true) only.
  - job_name: "mosquitto-exporter"
    static_configs:
      - targets: ["mosquitto-exporter:9234"]
  # END broker-job-mosquitto

  # BEGIN broker-job-emqx
  # EMQX (cluster stack) native Prometheus endpoint; no auth. Single-node mosquitto has no such endpoint.
  - job_name: "emqx"
    metrics_path: /api/v5/prometheus/stats
    static_configs:
      - targets: ["host.docker.internal:PLACEHOLDER_EMQX_WEB_PORT"]
  # END broker-job-emqx

  # ChirpStack exposes Prometheus metrics on `[monitoring].bind` (path /metrics), not the gRPC API port.
  # Single-node compose publishes 9091; cluster stack publishes 9091 (mode: host) on every node.
  # Prometheus reaches either via the host, so both modes share this one target.
  - job_name: "chirpstack"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]

