# ./data/* bind mounts: one-shot init fixes ownership for official image UIDs (no manual chown).
# Prometheus nobody=65534, Grafana=472, ChirpStack rules dir=1000, Portainer runs as root.
# Init uses postgres:14-alpine (already pulled with main stack) to avoid pulling alpine in offline env.
services:
  basic-data-init:
    image: postgres:14-alpine
    user: "0:0"
    restart: "no"
    # Use host network namespace so /sys/class/net and /proc/net/route match the device (no run.sh).
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./data/prometheus:/mnt/prometheus
      - ./data/grafana:/mnt/grafana
      - ./data/portainer:/mnt/portainer
      - ./data/prometheus-rules:/mnt/prometheus-rules
      - ./data/alertmanager-sync:/mnt/alertmanager-sync
      - ./data/chirpstack-backups:/mnt/chirpstack-backups
      - ./data/system_ota:/mnt/system_ota
      - ./configuration/alertmanager:/src/alertmanager:ro
      - ./configuration/prometheus/prometheus.yml:/src/prometheus-template.yml:ro
      - ./scripts/basic-data-init.sh:/src/basic-data-init.sh:ro
      - .:/mnt/service:rw
    # NOTE: keep as a SINGLE-element list. With entrypoint ["/bin/sh","-c"], a plain string
    # like "sh /src/basic-data-init.sh" is shell-split into ["sh","/src/basic-data-init.sh"],
    # so sh -c only receives "sh" (the rest become $0..) and the script never runs.
    # A single string element keeps the whole invocation as the sh -c command string.
    command: ["sh /src/basic-data-init.sh"]

  portainer:
    image: portainer/portainer-ce:2.39.2
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT}:9000/tcp"
    volumes:
      - ./data/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitor-net
    depends_on:
      basic-data-init:
        condition: service_completed_successfully

  # Ensure host dir has alerts/ with host-alerts.yml + chirpstack-active.yml (see configuration/prometheus).
  # ChirpStack writes chirpstack-active.yml from DB rules; prometheus.yml rule_files must point to that file.
  # Alertmanager loads ./data/alertmanager-sync/chirpstack-active.yml (seeded by basic-data-init; ChirpStack overwrites from UI/DB).
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090/tcp"
    volumes:
      - ./data/prometheus:/prometheus
      - ./data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Same host path as cartsbl chirpstack service ./data/prometheus-rules (ChirpStack writes active rules here).
      - ./data/prometheus-rules:/etc/prometheus/alerts-sync
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - monitor-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alertmanager:
        condition: service_started
      basic-data-init:
        condition: service_completed_successfully

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093/tcp"
    volumes:
      - ./data/alertmanager-sync/chirpstack-active.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitor-net
    depends_on:
      basic-data-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000/tcp"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./configuration/grafana/config/prometheus_datasource.yaml:/etc/grafana/provisioning/datasources/prometheus_datasource.yaml:ro
      - ./configuration/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configuration/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=light
    networks:
      - monitor-net
    depends_on:
      prometheus:
        condition: service_started
      basic-data-init:
        condition: service_completed_successfully

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100/tcp"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.netstat'
      - '--collector.tcpstat'
    networks:
      - monitor-net

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-quay.io/oliver006/redis_exporter:v1.82.0}
    container_name: redis-exporter
    restart: unless-stopped
    networks:
      - monitor-net
    environment:
      # Cluster stack: redis is fronted by haproxy on ${REDIS_FRONTEND_PORT}; reach it via the host.
      # Single-node compose publishes ${REDIS_PORT:-6379}, so the same host port works for both.
      - REDIS_ADDR=redis://host.docker.internal:${REDIS_FRONTEND_PORT:-6379}
      # - REDIS_PASSWORD=yourpassword
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121/tcp"

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:v0.17.1}
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      # Cluster stack: postgres is fronted by haproxy on ${POSTGRES_PORT} published to the host;
      # the exporter must not sit inside the backend postgres network. Reach it via host.docker.internal.
      # Single-node compose publishes ${POSTGRES_PORT:-5432} too, so the same host port works for both.
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-chirpstack}:${POSTGRES_PASSWORD:-chirpstack}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-chirpstack}?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187/tcp"
    networks:
      - monitor-net

  mosquitto-exporter:
    image: ${MOSQUITTO_EXPORTER_IMAGE:-sapcc/mosquitto-exporter:0.8.0}
    container_name: mosquitto-exporter
    restart: unless-stopped
    environment:
      # Cluster stack: emqx publishes ${EMQX_PORT} in host mode per node; reach it via the host.
      # Single-node compose publishes ${EMQX_PORT:-1883} too, so the same host port works for both.
      - BROKER_ENDPOINT=tcp://host.docker.internal:${EMQX_PORT:-1883}
      # - MQTT_USER=
      # - MQTT_PASS=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MOSQUITTO_EXPORTER_PORT:-9234}:9234"
    networks:
      - monitor-net

  # Provides pg_dump/pg_restore for backup management. Lives in the monitoring stack so the
  # business stacks (docker-compose/docker-stack) don't each run their own runner.
  # ChirpStack reaches it via host.docker.internal:8081 (exposed on the host).
  backup-runner:
    image: postgres:14-alpine3.21
    container_name: backup-runner
    restart: unless-stopped
    ports:
      - "${BACKUP_RUNNER_PORT:-8081}:8081/tcp"
    volumes:
      - ./data/chirpstack-backups:/var/lib/chirpstack/backups
      - ./backup-runner/runner.py:/runner.py:ro
      - ./backup-runner/packages.tar.gz:/tmp/packages.tar.gz:ro      
    environment:
      - RUNNER_HOST=0.0.0.0
      - RUNNER_PORT=8081
    networks:
      - monitor-net
    command: >
      sh -c "
        mkdir -p /tmp/packages &&
        tar -xzf /tmp/packages.tar.gz -C /tmp/packages &&
        apk add --no-network --allow-untrusted /tmp/packages/*.apk &&
        python3 /runner.py
      "

