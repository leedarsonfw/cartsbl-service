# Logging.
[logging]

  # Log level.
  #
  # Options are: trace, debug, info, warn error.
  level="info"


# PostgreSQL configuration.
[postgresql]

  # PostgreSQL DSN.
  #
  # Format example: postgres://<USERNAME>:<PASSWORD>@<HOSTNAME>/<DATABASE>?sslmode=<SSLMODE>.
  #
  # SSL mode options:
  #  * disable - Do not use TLS
  #  * prefer - Attempt to connect with TLS but allow sessions without
  #  * require - Require the use of TLS
  dsn="postgres://chirpstack:chirpstack@$POSTGRESQL_HOST/chirpstack?sslmode=disable"

  # Max open connections.
  #
  # This sets the max. number of open connections that are allowed in the
  # PostgreSQL connection pool.
  max_open_connections=10

  # Min idle connections.
  #
  # This sets the min. number of idle connections in the PostgreSQL connection
  # pool (0 = equal to max_open_connections).
  min_idle_connections=0


# Redis configuration.
[redis]

  # Server address or addresses.
  #
  # Set multiple addresses when connecting to a cluster.
  servers=[
    "redis://$REDIS_HOST:$REDIS_PORT/",
  ]

  # TLS enabled.
  tls_enabled=false

  # Redis Cluster.
  #
  # Set this to true when the provided URLs are pointing to a Redis Cluster
  # instance.
  cluster=false


# Network related configuration.
[network]

  # Network identifier (NetID, 3 bytes) encoded as HEX (e.g. 010203).
  net_id="000000"

  # Enabled regions.
  #
  # Multiple regions can be enabled simultaneously. Each region must match
  # the 'name' parameter of the region configuration in '[[regions]]'.
  enabled_regions=[
    "eu868",
    "us915_1",
  ]

# API interface configuration.
[api]

  # interface:port to bind the API interface to.
  bind="0.0.0.0:8080"

  # Secret.
  #
  # This secret is used for generating login and API tokens, make sure this
  # is never exposed. Changing this secret will invalidate all login and API
  # tokens. The following command can be used to generate a random secret:
  #   openssl rand -base64 32
  secret="you-must-replace-this"

# Prometheus metrics for alerting (`/metrics` on this bind). If empty, ChirpStack does not listen — Prometheus shows "connection refused".
# Port must match the `chirpstack` scrape target in prometheus.yml (e.g. chirpstack:9091).
[monitoring]
  bind="0.0.0.0:9091"


[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:$MQTT_BROKER_PORT/"
    json=true

# Alerts + Prometheus rule sync.
# When alert_settings.rules exists in the DB, ChirpStack writes the generated Prometheus rule file below
# and asks Prometheus to reload so the rules take effect.
[alerts]
  prometheus_static_rules_path="/var/application/prometheus/config/alerts/host-alerts.yml"
  # Writable path inside the container; ./data/prometheus-rules is bind-mounted here and into Prometheus alerts-sync.
  prometheus_active_rules_path="/var/lib/chirpstack/prometheus-rules/chirpstack-active.yml"
  prometheus_reload_url="http://prometheus:9090/-/reload"
  # Alertmanager: static template (read-only mount); ChirpStack writes to ./data/alertmanager-sync which Alertmanager reads directly.
  alertmanager_static_config_path="/var/application/alertmanager/config/alertmanager.yml"
  alertmanager_active_config_path="/var/lib/chirpstack/alertmanager/chirpstack-active.yml"
  alertmanager_reload_url="http://alertmanager:9093/-/reload"
